name: Sync TIMBO (fixtures)

on:
  schedule:
    # Cada 6 horas UTC (cada 4h sería 0 */4 * * *, pero 6h cubre bien el finde)
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar sync del server
        run: |
          curl -sS -X POST "${{ secrets.TIMBO_API_URL }}/api/sync/timbo" \
            -H "Content-Type: application/json" \
            -H "X-Timbo-Sync-Token: ${{ secrets.TIMBO_SYNC_TOKEN }}" \
            -d '{}' \
            -w "\nHTTP %{http_code}\n"